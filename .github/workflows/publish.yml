name: Build and deploy ICAIF website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: icaif-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare static output from Astro page
        run: |
          rm -rf dist
          mkdir -p dist
          cp src/pages/index.astro dist/index.html
          cp public/conference.css dist/conference.css
          cp public/interaction.css dist/interaction.css
          cp public/script.js dist/script.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
